name: CI - Presubmit on TPU

on:
  # Enable remote connections.
  # Step 1: Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  check_changes:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '!**.md'
              - '!docs/**'
              - '!docker/**'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.pre-commit-config.yaml'
              - '!.readthedocs.yaml'
              - '!mkdocs.yml'
              - '!LICENSE'
              - '!DCO'
              - '!MANIFEST.in'

  run_tests:
    needs: check_changes
    if: github.event.repository.fork == false && needs.check_changes.outputs.should_run == 'true'
    uses: ./.github/workflows/tests.yml
    name: "Run Tests"
    with:
      halt-for-connection: ${{ inputs.halt-for-connection }}
